<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoSketch — Desenhos Georreferenciados</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>GeoSketch</h1>
      <p>Aplicativo para desenhos georreferenciados no mapa.</p>
    </div>
    <div class="actions">
      <button id="btn-location" type="button">Ir para minha localização</button>
      <button id="btn-export" type="button">Exportar GeoJSON</button>
      <label class="import-label" for="input-import">Importar GeoJSON</label>
      <input id="input-import" type="file" accept=".geojson,.json,application/geo+json,application/json" />
      <button id="btn-clear" type="button" class="danger">Limpar tudo</button>
    </div>
  </header>

  <main>
    <aside class="panel">
      <h2>Resumo</h2>
      <ul id="summary-list">
        <li>Pontos: <strong id="count-markers">0</strong></li>
        <li>Linhas: <strong id="count-lines">0</strong></li>
        <li>Polígonos: <strong id="count-polygons">0</strong></li>
        <li>Área total: <strong id="total-area">0 m²</strong></li>
        <li>Extensão total: <strong id="total-length">0 m</strong></li>
      </ul>
      <p class="hint">
        Use as ferramentas de desenho no mapa para criar feições georreferenciadas.
        Os dados ficam salvos localmente no navegador.
      </p>
    </aside>

    <section id="map" aria-label="Mapa interativo"></section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="app.js"></script>
</body>
</html>
